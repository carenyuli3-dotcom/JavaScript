
<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

<script>

    let color = prompt("Ingrese Y, R o B para escoger el color:");

    switch (color) {

        case "Y":
            alert("El color ingresado es amarillo");
            break;

        case "R":
            alert("El color ingresado es rojo");
            break;

        case "B":
            alert("El color ingresado es azul");
            break;

        default:
            alert("Color ingresado fuera de rango");

    }

</script>

</body>
</html>
