<!DOCTYPE html>
<html>
<head>
    <title>Acceso al evento</title>
    <meta charset="UTF-8">
</head>

<body>

<script>
    let dia;

    dia = parseInt(prompt("Ingrese el número del día:"));

    if (dia == 6 || dia == 7) {
        document.write("Es fin de semana.");
    } else {
        document.write("Es un día entre semana.");
    }
</script>

</body>
</html>
