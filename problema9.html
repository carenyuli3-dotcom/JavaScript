```html
<!DOCTYPE html>
<html>
<head>
    <title>Acceso a una actividad</title>
    <meta charset="UTF-8">
</head>

<body>

<script>
    let edad, permiso;

    edad = parseInt(prompt("Ingrese su edad:"));
    permiso = prompt("¿Tiene permiso? (si/no)");

    if (edad >= 13 && permiso == "si") {
        document.write("Puedes participar en la actividad.");
    } else {
        document.write("No puedes participar en la actividad.");
    }
</script>

</body>
</html>
