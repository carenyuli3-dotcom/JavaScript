```html
<!DOCTYPE html>
<html>
<head>
    <title>Temperatura</title>
    <meta charset="UTF-8">
</head>

<body>

<script>
    let temperatura;

    temperatura = parseInt(prompt("Ingrese la temperatura actual:"));

    if (temperatura >= 25) {
        document.write("Hace calor. Puedes usar ropa fresca.");
    } else {
        document.write("Hace frío. Es mejor usar algo abrigado.");
    }
</script>

</body>
</html>
